<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>audiojoe probe</title>
  <style>
    :root { --bg:#f4f5f7; --panel:#fff; --panel2:#eceef2; --text:#111418; --muted:#3d4452; --line:#c9ced8;
            --accent:#1f5fd6; --accent-text:#fff; --ok:#137a3a; --ok-bg:#dff3e6; --bad:#a3231f; --bad-bg:#fbe1df;
            --warn:#8a5a00; --warn-bg:#fdf0d2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1114; --panel:#1a1d22; --panel2:#24282f; --text:#f1f3f6; --muted:#c2c8d2; --line:#3a404a;
              --accent:#6ea0ff; --accent-text:#0b1020; --ok:#7fe0a0; --ok-bg:#163423; --bad:#ff9a94; --bad-bg:#3d1a18;
              --warn:#ffd27a; --warn-bg:#3a2d10; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 22px/1.35 system-ui, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 34px; margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 20px; }
    .ctx { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
    .step { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 20px 24px; margin-bottom: 16px; }
    .step h2 { font-size: 26px; margin: 0 0 6px; }
    .step p { margin: 0 0 14px; color: var(--muted); }
    button { min-height: 76px; min-width: 160px; padding: 0 28px; border-radius: 16px; border: 0; font: inherit; font-weight: 700;
             background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.sec { background: var(--panel2); color: var(--text); }
    button.on { outline: 4px solid var(--accent); background: var(--panel2); color: var(--text); }
    button:disabled { opacity: .5; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .out { margin-top: 12px; font-size: 19px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
    .out .k { color: var(--muted); }
    .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; }
    #status { position: sticky; top: 0; padding: 14px 24px; background: var(--panel2); border-bottom: 2px solid var(--line); font-weight: 700; }
  </style>
</head>
<body>
  <div id="status"></div>
  <main id="app"></main>
  <script type="module" src="/src/probe.ts"></script>
</body>
</html>
