<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>audiojoe · Car test</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { --bg:#f4f5f7; --panel:#fff; --panel2:#eceef2; --text:#111418; --muted:#3d4452; --line:#c9ced8;
            --accent:#1f5fd6; --accent-text:#fff; --sel:#dde8fb; --ok:#137a3a; --ok-bg:#dff3e6; --bad:#a3231f; --bad-bg:#fbe1df;
            --warn:#7a4f00; --warn-bg:#fdf0d2; --warn-line:#d49b1f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1114; --panel:#1a1d22; --panel2:#24282f; --text:#f1f3f6; --muted:#c2c8d2; --line:#3a404a;
              --accent:#6ea0ff; --accent-text:#0b1020; --sel:#1d2a44; --ok:#7fe0a0; --ok-bg:#163423; --bad:#ff8a8a; --bad-bg:#3a1616;
              --warn:#ffd27a; --warn-bg:#3a2d10; --warn-line:#ffd27a; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.35 system-ui, sans-serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .bar b { font-size: 22px; }
    .bar .st { margin-left: auto; font-size: 15px; color: var(--muted); text-align: right; }
    main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
    .lead { color: var(--muted); margin: 0; }
    .grp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
    .grp h3 { margin: 0 0 8px; font-size: 18px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr 150px; gap: 12px; }
    .fields label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    .fields input { width: 100%; font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 52px; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; font-size: 16px; }
    .kv > :nth-child(odd) { color: var(--muted); }
    .small { font-size: 14px; color: var(--muted); }
    .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; }
    .actions { margin-top: auto; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; font-weight: 700; min-height: 64px; padding: 0 30px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-text); cursor: pointer; }
    button.sec { background: var(--panel2); color: var(--text); border: 1px solid var(--line); min-height: 56px; font-size: 17px; }
    button:disabled { opacity: .45; cursor: default; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); }
    .chip.ok { background: var(--ok-bg); border-color: transparent; } .chip.bad { background: var(--bad-bg); border-color: transparent; }
    .chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
    .ask { background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 16px; }
    .ask .big { font-size: 28px; font-weight: 800; color: var(--warn); }
    .ask .cnt { margin-left: auto; font-size: 32px; font-weight: 800; color: var(--warn); }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt { text-align: left; background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 14px; min-height: 84px;
           display: flex; gap: 12px; align-items: center; font-size: 18px; }
    .opt small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 3px; }
    .opt.on { border-color: var(--accent); background: var(--sel); }
    .opt .bx { width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--muted); flex: none; display: flex; align-items: center; justify-content: center; }
    .opt.on .bx { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    ul.chk { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 17px; }
    ul.chk li { display: flex; gap: 10px; align-items: center; }
    ul.chk .m { width: 22px; text-align: center; font-weight: 800; flex: none; }
    .i { width: 1.05em; height: 1.05em; vertical-align: -0.15em; display: inline-block; }
    .end { display: flex; gap: 22px; align-items: flex-start; }
    .qr { background: #fff; border-radius: 12px; padding: 12px; flex: none; width: min(92vh, 50vw); }
    .qr svg { display: block; width: 100%; height: auto; }
    .gap { margin-top: 6px; }
    .endcol { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .endtitle { font-size: 24px; font-weight: 800; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 14px; margin: 0; }
    @media (max-width: 760px) {
      .fields { grid-template-columns: 1fr 1fr; } .fields > :last-child { grid-column: span 2; }
      .opts { grid-template-columns: 1fr; }
      .end { flex-direction: column; } .qr { width: min(100%, 92vh); }
      .ask .big { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="bar"><b>audiojoe · <span id="title">Car test</span></b><span class="st" id="st"></span></div>
  <main id="app"></main>
  <script type="module" src="/src/testcar/main.ts"></script>
</body>
</html>
