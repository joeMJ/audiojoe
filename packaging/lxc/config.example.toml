# audiojoe server configuration (/etc/audiojoe/config.toml, mode 640 root:audiojoe)

# LAN address of the server. TLS is terminated by the reverse proxy in front of it
# (e.g. https://audio.example.org -> http://<this address>).
listen = "10.0.0.20:8080"
database = "/var/lib/audiojoe/audiojoe.db"
web_root = "/usr/share/audiojoe/web"

# Reverse proxies whose X-Forwarded-For header is trusted for the access log.
trusted_proxies = ["10.0.0.10"]

# Development only: browser capability probe (Tesla measurement). Off without this section;
# the results can be sent without a login, so keep it off on a server reachable from outside.
# [probe]
# token = "change-me-to-a-long-random-string"
# upstream = "http://127.0.0.1:8090"
