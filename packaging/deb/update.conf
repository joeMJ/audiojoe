# audiojoe-update: where new server versions come from (/etc/audiojoe/update.conf).
# The API address of a GitHub repository, or of a Gitea repository with the same releases
# (package audiojoe-server_<version>_amd64.deb and SHA256SUMS as release files).
SOURCE=https://api.github.com/repos/joeMJ/audiojoe

# Only for a private repository: file (mode 600) with a read-only access token.
#TOKEN_FILE=/etc/audiojoe/update-token
