[workspace]
resolver = "2"
members = ["server", "tests/attrappe"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
